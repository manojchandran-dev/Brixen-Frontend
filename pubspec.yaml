name: brixen
description: "Brixen - Workforce Intelligence Platform for multi-company HRMS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  go_router: ^14.0.0
  equatable: ^2.0.7
  shared_preferences: ^2.3.4
  intl: ^0.20.2
  local_auth: ^2.3.0
  dio: ^5.8.0
  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2
  flutter_quill: ^11.4.1
  record: ^7.1.1
  audioplayers: ^6.8.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  form_builder_validators: ^11.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    # Inter (SIL OFL 1.1 — assets/fonts/Inter-OFL.txt), the app-wide font
    # set in AppTheme. Other weights snap to the nearest of these.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"
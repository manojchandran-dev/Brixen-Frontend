name: brixen
description: "Brixen - Workforce Intelligence Platform for multi-company HRMS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  go_router: ^14.0.0
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  get_it: ^8.0.0
  shared_preferences: ^2.3.4
  intl: ^0.19.0
  local_auth: ^2.3.0
  dio: ^5.8.0
  flutter_riverpod: ^2.6.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"